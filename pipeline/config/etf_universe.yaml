# ETF universe for the monthly data pipeline.
# Tickers and names here are labels only and are NOT trusted: the pipeline takes
# tickers, currency and other facts from the downloaded issuer files, and fails an
# ETF if the ISIN in its file does not match the ISIN below.
#
# product_url was verified on 2026-11-03 by checking the page belongs to the ISIN:
#   iShares: the page data pairs the ISIN with this product id ("ISIN~SEDOL~productId").
#   HSBC: the page's shareId equals the ISIN. HSBC URLs use the individual-investor
#   site; the institutional pages require declaring you are a Professional Client.
# Scope: accumulating share classes only (decided 2026-11-03). Distributing funds are out of
# scope, so each fund's NAV history is its total-return series.
