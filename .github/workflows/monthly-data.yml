name: Monthly ETF data

on:
  schedule:
    # 06:00 UTC on the 10th: issuer factsheets are usually updated within 10 days of month end.
    - cron: "0 6 10 * *"
  workflow_dispatch:
    inputs:
      issuer:
        description: "Only this issuer"
        type: choice
        options: [all, ishares, hsbc]
        default: all
      isin:
        description: "Only this ISIN (optional)"
        type: string
        required: false
      skip_download:
        description: "Re-parse the latest stored raw files instead of downloading"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: monthly-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # ~45 funds at >=3 s per request; HSBC needs ~8 requests per fund
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      - name: Unit tests
        run: python -m pytest pipeline/tests -q

      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ISSUER: ${{ inputs.issuer }}
          ISIN: ${{ inputs.isin }}
          SKIP_DOWNLOAD: ${{ inputs.skip_download }}
        run: |
          args=(run)
          if [[ -n "$ISSUER" && "$ISSUER" != "all" ]]; then args+=(--issuer "$ISSUER"); fi
          if [[ -n "$ISIN" ]]; then args+=(--isin "$ISIN"); fi
          if [[ "$SKIP_DOWNLOAD" == "true" ]]; then args+=(--skip-download); fi
          set -o pipefail
          python -m pipeline "${args[@]}" 2>&1 | tee run.log
        # A non-zero exit (any ETF or FX failed) fails the job, and GitHub emails the repo owner.

      - name: Job summary
        if: always()
        run: |
          if [[ -f run.log ]]; then
            { echo '```'; sed -n '/Rows loaded/,$p' run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
